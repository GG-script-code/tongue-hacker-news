<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/img/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tongue - Hacker News Reader</title>
    <link rel="stylesheet" href="/src/css/style.css" />
  </head>
  <body>
    <header class="app-header">
      <img src="/src/img/logo.svg" alt="Tongue logo" class="app-logo" />
      <div>
        <h1>Tongue</h1>
        <p class="app-subtitle">Le ultime notizie tech, direttamente da Hacker News</p>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Attiva tema scuro">
        ☾
      </button>
    </header>

    <div class="controls-wrapper">
      <input
        type="search"
        id="search-input"
        class="search-input"
        placeholder="Cerca nelle news caricate..."
        aria-label="Cerca nelle news"
      />

      <div class="controls-row">
        <div class="control-group">
          <label for="sort-select" class="control-label">Ordina per</label>
          <select id="sort-select" class="control-select">
            <option value="newest">Più recenti</option>
            <option value="title-asc">Titolo A-Z</option>
            <option value="title-desc">Titolo Z-A</option>
          </select>
        </div>

        <div class="control-group control-group-button">
          <span class="control-label">&nbsp;</span>
          <button id="refresh-btn" class="refresh-btn" type="button">Aggiorna news</button>
        </div>
      </div>
    </div>

    <main>
      <section id="news-container" class="news-list"></section>
    </main>

    <footer class="app-footer">
      <button id="load-more-btn" class="load-more" type="button" style="display: none">
        Carica altre news
      </button>
    </footer>

    <button
      id="back-to-top"
      class="back-to-top"
      type="button"
      aria-label="Torna su"
      style="display: none"
    >
      ↑
    </button>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>

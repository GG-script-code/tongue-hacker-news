<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/img/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tongue - Hacker News Reader</title>
    <!-- MANCAVA QUESTA RIGA: importa il foglio di stile principale -->
    <link rel="stylesheet" href="/src/css/style.css" />
  </head>
  <body>
    <header class="app-header">
      <img src="/src/img/logo.svg" alt="Tongue logo" class="app-logo" />
      <div>
        <h1>Tongue</h1>
        <p class="app-subtitle">Le ultime notizie tech, direttamente da Hacker News</p>
      </div>
    </header>

    <main>
      <section id="news-container" class="news-list"></section>
    </main>

    <footer class="app-footer">
      <button id="load-more-btn" class="load-more" type="button" style="display: none">
        Carica altre news
      </button>
    </footer>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
